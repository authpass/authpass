name: iOS und MacOS Build/Release

on:
  workflow_dispatch:
    inputs:
      blubb:
        description: 'Never Mind'
        required: false
        default: ''
  push:
    branches:
      - 'stable'
      - 'beta'
      - 'macos-stable'


jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        platform: ['ios', 'macos']
    name: "Build ${{ matrix.platform }}"
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      # SOPS_AGE_KEY here too, and for a different reason than below:
      # ci-install-deps writes lib/env/production.dart, which the compiler
      # reads long after any one step has ended and `secrets exec` cannot
      # therefore provide. Without the key it skips that and the release build
      # fails on a missing import.
      - name: ci-install-deps
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: "./authpass/_tools/ci-install-deps.sh ios"
      # One secret, and it is the only one. SOPS_AGE_KEY decrypts
      # secrets/release.yaml; `secrets exec` puts every credential in the
      # environment for the length of this step and removes what it wrote
      # however the step ends. Nothing fetches certificates at build time, and
      # no credential is written into the workspace.
      #
      # `keychain exec` rather than `secrets exec`: it imports the certificate
      # into a keychain that dies with the step, installs the named profiles,
      # and — the reason it is the outer wrapper — places no App Store Connect
      # credential in the environment at all. The archive therefore cannot hold
      # a key that could create or revoke signing material.
      #
      # Since cux_ship 3.0.0 the child gets the keychain and *nothing* else:
      # no credentials without `--only`, and never the sops identity. The
      # deploy key is named because ci-release.sh pushes build numbers; the
      # upload is a separate step below, because the nested `secrets exec` the
      # build used to run cannot decrypt anything in here any more — which is
      # the point, not a limitation.
      #
      # Profiles are named because naming them is what makes an expired one
      # fatal here rather than a signing failure twenty minutes in. All four,
      # because this one step covers both platforms.
      - name: 'ci-release ${{ matrix.platform }}'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: >-
          ./authpass/_tools/ship.sh keychain exec
          --profile ios_appstore --profile ios_appstore_autofill
          --profile macos_appstore --profile macos_developerid
          --only ssh_keys.github_deploy --
          ./authpass/_tools/ci-release.sh ${{ matrix.platform }}
      # The upload, outside `keychain exec`: it needs the App Store Connect key
      # and nothing signing-related, the exact inverse of the build. `--only`
      # places that one credential rather than all seventeen.
      - name: 'upload ${{ matrix.platform }}'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: >-
          ./authpass/_tools/ship.sh secrets exec
          --only apple.api_keys.upload --
          ./authpass/_tools/upload-${{ matrix.platform }}.sh
