name: iOS und MacOS Build/Release

on:
  workflow_dispatch:
    inputs:
      blubb:
        description: 'Never Mind'
        required: false
        default: ''
  push:
    branches:
      - 'stable'
      - 'beta'
      - 'macos-stable'


jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        platform: ['ios', 'macos']
    name: "Build ${{ matrix.platform }}"
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - name: ci-install-deps
        run: "./authpass/_tools/ci-install-deps.sh ios"
      # One secret, and it is the only one. SOPS_AGE_KEY decrypts
      # secrets/release.yaml; `secrets exec` puts every credential in the
      # environment for the length of this step and removes what it wrote
      # however the step ends. Nothing fetches certificates at build time, and
      # no credential is written into the workspace.
      #
      # --keystore and --api-key are named because the file holds two of each:
      # an upload keystore and an Amazon one, and an app-scoped API key
      # alongside the team key that can read the developer portal. cux_ship
      # refuses to guess between them rather than picking the first.
      - name: 'ci-release ${{ matrix.platform }}'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: >-
          cd authpass/_tools/cux_ship &&
          dart run cux_ship secrets exec
          --keystore upload --api-key upload --
          ./authpass/_tools/ci-release.sh ${{ matrix.platform }}
