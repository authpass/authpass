name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:

  drive_ios:

    runs-on: macos-latest

    strategy:
      matrix:
        device:
#          - "iPhone 8 (13.1)"
          - "iPhone 17 Pro Max"

      fail-fast: true

    steps:
    - uses: actions/checkout@v3
    - name: Checkout submodules
      shell: bash
      run: |
        auth_header="$(git config --local --get http.https://github.com/.extraheader)"
        git submodule sync --recursive
        git -c "http.extraheader=$auth_header" -c protocol.version=2 submodule update --init --force --recursive --depth=1
#    - name: Postdeploy
#      env:
#        SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
#      run: authpass/_tools/postdeploy.sh
    - name: ci-install-deps
      env:
        SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      run: "./authpass/_tools/ci-install-deps.sh ios"
    # The app embeds an extension which embeds a separate flutter module, and
    # that module's xcframeworks are build output — gitignored, so a fresh
    # checkout has none and the simulator build stops on the missing file.
    # _tools/build-ios.sh does this for a release; a test build has to do it
    # too. Debug, because the simulator slice of a release App.xcframework is
    # an 84 KB stub — release AOT does not exist there.
    - name: autofill module frameworks
      run: |
        export PATH="$HOME/deps/flutter/bin:$PATH"
        ./autofill_module/build_ios_framework.sh Debug
    - name: 'Start Simulator'
      uses: futureware-tech/simulator-action@v4
      with:
        model: ${{ matrix.device }}
#    - name: List all simulators
#      run: xcrun instruments -s
#    # get UUID  simulator and boot a simulator on mac from  command line
#    - name: Start Simulator
#      run: |
#        UDID=$(
#          xcrun instruments -s |
#          awk \
#            -F ' *[][]' \
#            -v 'device=${{ matrix.device }}' \
#            '$1 ~ device { print $2 }' | head -n 1
#        )
#        echo starting ${UDID}
#        xcrun simctl boot "${UDID:?No Simulator with this name found}"
    - name: run test integration_test
      run: "cd authpass && ~/deps/flutter/bin/flutter test integration_test"
#    - uses: actions/upload-artifact@v1
#      with:
#        name: driver-screenshots
#        path: authpass/build/screenshots


  # Android was the one platform with no runtime coverage at all: the kdbx-open
  # test above ran only on an iOS simulator, and the autofill mirror's eager
  # PathProviderFoundation() — an FFI dlopen of Foundation.framework — broke
  # every database open on Android while passing iOS, macOS-host unit tests,
  # and the compile-only android release builds. It reached the Play internal
  # and beta tracks (1.9.12 build 2168) before a phone found it. Same test,
  # an emulator.
  drive_android:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Checkout submodules
      shell: bash
      run: |
        auth_header="$(git config --local --get http.https://github.com/.extraheader)"
        git submodule sync --recursive
        git -c "http.extraheader=$auth_header" -c protocol.version=2 submodule update --init --force --recursive --depth=1
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: ci-install-deps
      env:
        SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      run: "./authpass/_tools/ci-install-deps.sh linux"
    # The emulator is unusably slow without hardware acceleration, and the
    # runner's kvm device is root-only by default.
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    # android-emulator-runner downloads the system image with a single
    # unretried `sdkmanager --install`, and on 2026-11-10 that came back
    # truncated: "Error on ZipFile unknown archive", which failed the job in
    # 2m15s before an emulator existed. The "could not connect to TCP port
    # 5554" line right after it is the action's own cleanup finding no
    # emulator to kill — a symptom, not the cause.
    #
    # Installing it here first means the action's call finds it in place and
    # returns without downloading anything, so this step owns the one
    # download and can retry it. Each retry deletes the partial image and
    # sdkmanager's cache, because otherwise a second attempt can unpack the
    # same corrupt file again.
    #
    # Not cached across runs on purpose: a cache keyed on the image would
    # also cache a bad copy of it, turning a transient failure into a
    # permanent one, and the download is ~10s when it works.
    #
    # sdkmanager is addressed by full path, not as a bare command. It is not
    # on PATH in an ordinary step — the action's log shows a bare
    # `sdkmanager` only because the action puts cmdline-tools on PATH for
    # itself first, and the first version of this step failed three times
    # with "sdkmanager: command not found" on that assumption.
    - name: Android system image
      run: |
        image='system-images;android-34;default;x86_64'
        sdkmanager=
        for candidate in \
            "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" \
            "$(command -v sdkmanager || true)" ; do
          if test -n "${candidate}" && test -x "${candidate}" ; then
            sdkmanager="${candidate}"
            break
          fi
        done
        if test -z "${sdkmanager}" ; then
          echo "no sdkmanager found (ANDROID_HOME=${ANDROID_HOME:-unset})" >&2
          ls -la "${ANDROID_HOME:-/nonexistent}/cmdline-tools" >&2 || true
          exit 1
        fi
        echo "using ${sdkmanager}"
        yes | "${sdkmanager}" --licenses > /dev/null 2>&1 || true
        for attempt in 1 2 3; do
          if "${sdkmanager}" --install "${image}" --channel=0 ; then
            exit 0
          fi
          echo "attempt ${attempt} for ${image} failed; clearing partial download" >&2
          rm -rf "${ANDROID_HOME:?}/system-images/android-34" "${HOME}/.android/cache"
          sleep 15
        done
        echo "could not install ${image} after 3 attempts" >&2
        exit 1
    - name: run test integration_test on an emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        profile: pixel_6
        # sideload: a flavor with no store signing requirement, so the debug
        # build the test installs needs no credential.
        script: cd authpass && ~/deps/flutter/bin/flutter test integration_test --flavor sideload
