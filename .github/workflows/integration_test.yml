name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:

  drive_ios:

    runs-on: macos-latest

    strategy:
      matrix:
        device:
#          - "iPhone 8 (13.1)"
          - "iPhone 17 Pro Max"

      fail-fast: true

    steps:
    - uses: actions/checkout@v3
    - name: Checkout submodules
      shell: bash
      run: |
        auth_header="$(git config --local --get http.https://github.com/.extraheader)"
        git submodule sync --recursive
        git -c "http.extraheader=$auth_header" -c protocol.version=2 submodule update --init --force --recursive --depth=1
#    - name: Postdeploy
#      env:
#        SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
#      run: authpass/_tools/postdeploy.sh
    - name: ci-install-deps
      env:
        SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      run: "./authpass/_tools/ci-install-deps.sh ios"
    # The app embeds an extension which embeds a separate flutter module, and
    # that module's xcframeworks are build output — gitignored, so a fresh
    # checkout has none and the simulator build stops on the missing file.
    # _tools/build-ios.sh does this for a release; a test build has to do it
    # too. Debug, because the simulator slice of a release App.xcframework is
    # an 84 KB stub — release AOT does not exist there.
    - name: autofill module frameworks
      run: |
        export PATH="$HOME/deps/flutter/bin:$PATH"
        ./autofill_module/build_ios_framework.sh Debug
    - name: 'Start Simulator'
      uses: futureware-tech/simulator-action@v4
      with:
        model: ${{ matrix.device }}
#    - name: List all simulators
#      run: xcrun instruments -s
#    # get UUID  simulator and boot a simulator on mac from  command line
#    - name: Start Simulator
#      run: |
#        UDID=$(
#          xcrun instruments -s |
#          awk \
#            -F ' *[][]' \
#            -v 'device=${{ matrix.device }}' \
#            '$1 ~ device { print $2 }' | head -n 1
#        )
#        echo starting ${UDID}
#        xcrun simctl boot "${UDID:?No Simulator with this name found}"
    - name: run test integration_test
      run: "cd authpass && ~/deps/flutter/bin/flutter test integration_test"
