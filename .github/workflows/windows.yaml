name: build windows

on: 
  push:
    branches:
      - 'windows**'
      - 'stable'
      - 'beta'

jobs:
  build:

    strategy:
      matrix:
        flavor: ['windows', 'msix', 'windowsportable']
        # windows-2025 does not contain innosetup https://github.com/actions/runner-images/issues/11349
        os: [windows-2022]
        vs: [2022]

      fail-fast: true

    runs-on: ${{ matrix.os }}

    steps:
    # Before the checkout, so the clone is born with it: with autocrlf on
    # (the runner default), git reports LF-normalized files as pending CRLF
    # conversions, and the buildnumber allocator's clean-repository assertion
    # reads that as a dirty tree. Checked out as-is, the tree stays clean.
    - shell: bash
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v3
      with:
        submodules: true
    - shell: bash
      run: git status
    - shell: bash
      run: git diff
    - shell: bash
      run: |
        set -xeu
        git config core.autocrlf
        git config --global core.autocrlf true
        git submodule update
        git checkout -- .
        git submodule foreach git checkout -- .
        git status
        git diff-index HEAD
        for f in `git ls-files -s | awk '/120000/{print $4}'`; do git update-index --assume-unchanged $f; done
    - name: ci-install-deps
      shell: bash
      env:
        SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      run: |
        ./authpass/_tools/ci-install-deps.sh windows
        ~/deps/flutter/bin/flutter config --enable-windows-desktop
    - name: build ${{ matrix.flavor }} apk
      id: buildapk
      shell: bash
      env:
        SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        GIT_AUTHOR_NAME: 'Github Action CI'
        GIT_AUTHOR_EMAIL: 'herbert.github.ci@codeux.design'
        GIT_COMMITTER_NAME: 'Github Action CI'
        GIT_COMMITTER_EMAIL: 'herbert.github.ci@codeux.design'
      # No secrets exec: the build consumes no credential — the wrapper was a
      # relic of the pre-split single step, and what it placed included the
      # deploy key, which routed the build-number push onto ssh. Without it the
      # allocator pushes via the checkout's https origin, the path every linux
      # and android run already proves. The upload step below keeps its own
      # scoped secrets exec.
      run: "./authpass/_tools/ci-release.sh ${{ matrix.flavor }}"
#    - shell: bash
#      run: |
#        cat authpass/lib/generated_plugin_registrant.dart
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.buildapk.outputs.outputfilename }}
        path: authpass/${{ steps.buildapk.outputs.outputpath }}
    - name: upload artifact
      shell: bash
      env:
        SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      run: >-
        ./authpass/_tools/ship.sh secrets exec --keystore upload --api-key upload --
        ./authpass/_tools/upload-artifact.sh authpass/${{ steps.buildapk.outputs.outputpath }}
