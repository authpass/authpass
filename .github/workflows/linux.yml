name: build linux

on:
  push:
    branches:
      - 'linux**'
      - 'stable'
      - 'beta'
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    strategy:
      matrix:
        flavor: ['linux']

      fail-fast: true

    steps:
    - uses: actions/checkout@v3
    - name: Checkout submodules
      shell: bash
      run: |
        auth_header="$(git config --local --get http.https://github.com/.extraheader)"
        git submodule sync --recursive
        git -c "http.extraheader=$auth_header" -c protocol.version=2 submodule update --init --force --recursive --depth=1
    - run: |
        sudo apt-get update
        sudo apt-get install -y \
        clang \
        cmake \
        ninja-build \
        file pkg-config git unzip \
        libgtk-3-dev libx11-dev \
        libsecret-1-dev \
        keybinder-3.0
    - name: ci-install-deps
      env:
        SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      run: "./authpass/_tools/ci-install-deps.sh linux"
#    - run: ~/deps/flutter/bin/flutter channel master && ~/deps/flutter/bin/flutter upgrade && ~/deps/flutter/bin/flutter config --enable-linux-desktop
    - run: ~/deps/flutter/bin/flutter config --enable-linux-desktop
    - name: build ${{ matrix.flavor }} apk
      id: buildapk
      env:
        SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        GIT_AUTHOR_NAME: 'Github Action CI'
        GIT_AUTHOR_EMAIL: 'herbert.github.ci@codeux.design'
        GIT_COMMITTER_NAME: 'Github Action CI'
        GIT_COMMITTER_EMAIL: 'herbert.github.ci@codeux.design'
      run: >-
        ./authpass/_tools/ship.sh secrets exec --keystore upload --api-key upload --
        ./authpass/_tools/ci-release.sh ${{ matrix.flavor }}
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.buildapk.outputs.outputfilename }}
        path: authpass/${{ steps.buildapk.outputs.outputpath }}
    - name: upload artifact
      env:
        SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      run: >-
        ./authpass/_tools/ship.sh secrets exec --keystore upload --api-key upload --
        ./authpass/_tools/upload-artifact.sh authpass/${{ steps.buildapk.outputs.outputpath }}
    - uses: snapcore/action-build@v1
      id: snapcraft
    # snapcraft names the file after the snap, not after the release, so the
    # version has to be put back on it for the download page: artifact-push.php
    # admits `authpass_<version>_amd64.snap` and derives the `latest` symlink
    # and version file from that name.
    #
    # A copy under the published name, rather than the second argument
    # upload-artifact.sh takes, because the manifest has to travel under that
    # name too — it is published as `<published name>.manifest.json`, and a
    # reader refuses a sidecar whose stem disagrees with the artifact it names.
    # A copy and not a rename: the publish step below still wants the name
    # snapcraft chose.
    - name: name the snap after the release, and write its manifest
      id: snap
      run: |
        manifest="authpass/${{ steps.buildapk.outputs.outputpath }}.manifest.json"
        # Taken from the tarball's manifest rather than read a second time, so
        # the name on the download page and the manifest beside it cannot
        # disagree about which build this is.
        snap="authpass_$(jq -r .versionName "${manifest}")_$(jq -r .buildNumber "${manifest}")_amd64.snap"
        cp "${{ steps.snapcraft.outputs.snap }}" "${snap}"
        # The snap *is* that tarball: snap/snapcraft.yaml pulls
        # authpass-linux-latest.tar.gz, which the step above published from
        # this very job. So the build facts are inherited rather than retyped,
        # the same way make_deb.yaml derives the deb's, and the tarball sits
        # beside its manifest here, so the parent digest is checked in the same
        # call. No --packaging, unlike the deb: the packaging files are this
        # checkout, which is the commit the parent manifest already records.
        ./authpass/_tools/ship.sh manifest write \
          --artifact "${PWD}/${snap}" --platform linux --format snap \
          --derived-from "${PWD}/${manifest}"
        echo "snap=${snap}" >> "$GITHUB_OUTPUT"
    - name: upload snap artifact
      env:
        SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      run: >-
        ./authpass/_tools/ship.sh secrets exec --keystore upload --api-key upload --
        ./authpass/_tools/upload-artifact.sh ${{ steps.snap.outputs.snap }}
    - uses: snapcore/action-publish@v1
      env:
        SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
      with:
        snap: ${{ steps.snapcraft.outputs.snap }}
        release: edge
    - uses: actions/upload-artifact@v4
      with:
        name: authpass-${{ steps.buildapk.outputs.appversion }}_${{ steps.buildapk.outputs.appbuildnumber }}-snap
        path: ${{ steps.snapcraft.outputs.snap }}
