name: credential_matcher
description: >-
  Decides which stored entries may be offered for a fill request, by
  registrable domain (eTLD+1). Shared by the app and the autofill extension.
publish_to: 'none'
version: 1.0.0

# Deliberately a plain Dart package, not a Flutter one: it is loaded inside the
# credential provider extension, where every dependency is charged against a
# memory budget measured in tens of megabytes.
environment:
  sdk: ^3.8.0

dependencies:
  # The same git source and ref the app and the module use. Pub refuses to mix
  # sources for one package across a dependency graph, so all three have to
  # agree — a path here would break the app's resolution and vice versa.
  kdbx:
    git:
      url: https://github.com/authpass/kdbx.dart.git
      ref: 5ec70166b79c821300c1bf7403c8f2291d834204
  public_suffix: ^3.0.0
  string_literal_finder_annotations: ^1.0.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
