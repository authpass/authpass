name: autofill_shared
description: >-
  The contract between the app and the credential provider extension: the
  manifest indexing mirrored vaults, and the matcher deciding which entries may
  be offered for a fill request. Written by the app, read by both.
publish_to: 'none'
version: 1.0.0

# Deliberately a plain Dart package, not a Flutter one: it is loaded inside the
# credential provider extension, where every dependency is charged against a
# memory budget measured in tens of megabytes.
environment:
  sdk: ^3.8.0

dependencies:
  # The same constraint the app and the module use. Pub refuses to mix sources
  # for one package across a dependency graph, so all three have to agree — a
  # path or git ref here would break the app's resolution and vice versa.
  kdbx: ^2.5.0
  public_suffix: ^3.0.0
  string_literal_finder_annotations: ^1.0.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
