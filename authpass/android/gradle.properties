org.gradle.jvmargs=-Xmx4G

# The NDK every module builds with. app/build.gradle and argon2_ffi's own
# build.gradle both read this system property, so one value here keeps them on
# the same NDK -- argon2_ffi otherwise falls back to its own default of r27.
#
# It has to be r28 or newer: r27 links shared libraries with
# -Wl,-z,max-page-size=4096 unless ANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES is
# opted into, and Play rejects a release targeting Android 15+ whose 64-bit
# libraries are not 16 KB aligned ("Your app does not support 16 KB memory
# page sizes"). r28 makes 16 KB the default.
systemProp.design.codeux.ndkVersion=28.2.13676358

android.useAndroidX=true
android.enableJetifier=true
# No idea, this will crash on launch with:
# java.lang.IncompatibleClassChangeError: Class 'android.content.res.XmlBlock$Parser' does not implement interface 'j8.a' in call to 'int j8.a.next()' (declaration of 'z.b' appears in /data/app/design.codeux.authpass-swqx9NIaYieBd8FrWYzciw==/base.apk)
android.enableR8.fullMode=false
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
