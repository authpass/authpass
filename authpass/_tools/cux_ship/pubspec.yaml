name: authpass_ship
description: >-
  Resolves the release tooling. One directory for it to be run from, and one
  place to bump the version.
publish_to: 'none'
version: 1.0.0

# https://pub.dev/packages/cux_ship — a plain hosted dependency since 1.6.0,
# which was its first release on pub. Before that it was consumed as a git ref,
# and this wrapper existed partly to keep that ref in one place.
#
# The wrapper still earns its keep: it gives the release scripts a directory to
# run `dart run cux_ship` from, and keeps the tooling's dependencies out of the
# app's own lockfile.
#
# TO BUMP: change the one constraint below, then `dart pub upgrade` here.
environment:
  sdk: ^3.8.0

dependencies:
  # 3.5.0: --beta-group carries an external TestFlight group through beta
  # review (description reasserted from store/appstore/listings/, idempotent
  # submission, externalBuildState read back), and `appstore beta-release`
  # releases a build CI already uploaded — the whole external beta is one
  # command. 3.4.2 brought the windows support and the same-commit tag race
  # fix.
  # 3.6.0: `appstore beta-groups` prints the group names --beta-group needs
  # (the kind with them — internal or external decides what a release costs),
  # a lookup that misses names what exists, and a group kind Apple did not
  # report is refused at release rather than guessed. 3.5.1 brought the
  # symlink-aware committed-notes guard this repo's root CHANGELOG.md needs.
  # 4.5.0-dev.9: a prerelease, and taken deliberately. `cux_train` — the
  # release train, below — depends on `package:cux_ship/provenance.dart` for
  # the tag that records what each destination reached, and that library is
  # published in no 4.4.x: it first ships in 4.5.0-dev.9. One wrapper and one
  # lockfile is the arrangement worth keeping, so the two cannot be on
  # different majors, and a stable 4.5.0 does not exist yet.
  #
  # What that means for every other caller of this lockfile: everything that
  # runs `cux_ship` gets 4.5.0-dev.9 rather than 3.6.0 — `ship.sh` for
  # `secrets`, `deps`, `keychain` and `manifest`, and the three uploaders,
  # which run `dart run cux_ship` from this directory directly rather than
  # through `ship.sh`. The 4.x changelog was read against this repository's
  # own invocations before the bump; the PR records what was found, including
  # the two 4.0.0 items that cannot reach here because no script passes
  # `--data-safety` or `--metadata`.
  cux_ship: ^4.5.0-dev.9
  # The release train: it orders the steps of a release, waits on the ones a
  # person performs, and records each as a git tag. Run through
  # `tool/train.sh`, which reads `.cux-train.yaml` at the repository root.
  #
  # **A git ref because it is not published**, and pinned to a commit rather
  # than to a branch: this is release tooling, and a mutable ref would mean
  # two runs of the same release could use different code. A merge commit on
  # `main` rather than the branch tip it merged, so that the pin stays
  # fetchable however that branch is later tidied away. `cux_ship`'s CI
  # resolves `cux_ship` as a git dependency and not this package; what tests
  # this shape is this repository's own CI, where every `ship.sh` call
  # resolves the wrapper from a fresh checkout.
  #
  # **This pin and `.cux-train.yaml` move together, in one commit.** The ref
  # below is the first with the `internal` verb, and the table now declares a
  # `dispatch`, eight `wait` rows and one local step for it. The pin it
  # replaced
  # (9a430873, tagged `v4.5.0-dev.9`) refuses that table outright —
  # `.cux-train.yaml has an unknown key: dispatch` — so a tree carrying one
  # without the other has no working `tool/train.sh`, `status` included.
  #
  # TO BUMP: change `ref` to the new commit, then `dart pub upgrade` here.
  cux_train:
    git:
      url: https://github.com/codeuxdesign/cux_ship.git
      path: cux_train
      ref: 0ec09b7c9c2d9ee92cf7f1d7495a8b71557b6c18
  # The git-buildnumber port, invoked through ship.sh's `buildnumber`
  # dispatch. Replaces the shell script release.sh used to curl from the
  # mutable `stable` branch and execute — unpinned, unhashed, run on a CI
  # machine holding push credentials. A separate package from cux_ship (an
  # allocator whose only dependency is git should not pull googleapis), but
  # pinned by the same lockfile so there is exactly one place to bump.
  cux_buildnumber: ^0.1.0-dev.1
